name: learning-repository-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify dry-run
        run: ZEROBUS_EVENT_COUNT=10 python -m src.producer.efuse_producer --dry-run
      - name: Verify safe reliability simulation
        run: python -m src.producer.reliability_lab --simulate
      - name: Verify capped benchmark preview
        run: python -m src.benchmarks.benchmark --count 10 --dry-run

# Intentionally no live Databricks credential in CI. Live tests are manual.
